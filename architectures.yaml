# Every architecture in the field guide: what to draw, plus its metadata.
#
# Diagram rows are listed bottom to top. Each row is a group of cells:
#   cell     cell type, or a list with one type per position
#   n        number of cells (inferred from a list)
#   connect  rule linking this row to the previous one (or to `from`):
#            full | causal | one | near:k | pairs (with `pairs: [[src, dst], ...]`)
#   style    link style for that rule (link, frozen, cross, gate, state, loop, skip, func)
#   chain    right | left | double: state arrows between neighbours in the row
#   gate     true: dotted gate from the row below to a dot on each state arrow;
#            recurrent: also from the previous state cell, hooked onto the dot from above
#   dim      indices drawn faded (inactive or low weight); edges touching them fade too
#   level / y / xs / ys / pitch / ring: placement overrides (normally automatic)
#   marks    false: leave this row's cells without their group mark (e.g. a picture's patches)
# Panel-level extras: links (extra rules between any rows), arcs (skip connections) and
# loops (return arrows, style `loop`), both elbows beside the layers with `side` and optional
# `reach` (an arc between two whole rows of the same size is drawn once per column; a loop
# with `whole: true` feeds the whole `from` row back to the whole `to` row instead: a line
# above the outputs, down the side, and beneath the inputs, with an arrow into each, the
# outputs keeping their stems past it), arrows (straight, in the state arrow's style unless
# given: from a cell [group, i]
# or a whole group id to a cell), feeds (an arrow from a whole group that runs beneath a row,
# just below its stems: `from` a group `to` a row; with `branches: true` it runs instead
# twice a stem's length beneath the cells, and a short arrow rises into each, as an image's
# patches feed ViT's tokens),
# drops (an arrow that leaves a state arrow partway `along` [cell, cell] and drops straight
# down `to` the cell beneath it, with no dot; Bahdanau's attention reads the previous state),
# levels (number of rows on the vertical grid),
# span ([bottom y, top y]),
# flow (optional; the page's step-through follows the lines by default. false: none. A list:
# hand-written steps, for networks that settle or sample rather than pass data once; each
# step lights its `to` cells, and the lines joining them to its `from` cells, which show
# half-lit, being read from; with `within: true`, also the lines among its `to` cells. Cells
# are named as elsewhere: a group, [group, i], or a list).
# Every link is drawn at one weight and stops the same distance from what it meets; a cell's
# stems and ticks are a little heavier and set farther off, so they read as marks, not links.
# `objective_math` replaces the objective's shared formula (guide.py's OBJECTIVE_MATH) with the
# landmark paper's own form; `x` marks a variable (italic), _{...} and ^{...} sub- and superscripts.
# Captions, summaries and reading notes mark variables the same way: picks `k` experts.
# `also_objectives` lists further objectives the landmark paper itself trained it with; like
# `also`, only the page's filter and panel show them, and the poster keeps one objective.
# `related` links panels: kind_of (a more specific version of), builds_on (a direct ancestor),
# built_with (the networks it is usually built from). Each is written once, on the more specific
# panel; the page shows it from both ends (Kind of / Kinds, Builds on / Led to,
# Often built with / Often used in).
# `aka` lists other names and close variants (RWKV under linear attention): the page's search
# finds the panel by them, and its Related section lists them.
# An architecture may carry `also`: ids of further sections it belongs to. The poster places it
# once, in its own section; the page's family filter shows it under each of these too.
# An architecture may carry a `note`: one sentence printed as a footnote on the poster and
# under the caption on the page, with a superscript marker after the caption.

title: Neural Network Field Guide
web_title: Neural Network Field Guide
subtitle: "{count} architectures and training schemes, from {first} ({first_year}) to {last} ({last_year})."  # filled in from the panels: the count, the oldest and the newest
reading: "Each diagram draws a network in miniature, from input at the bottom to output at the top. In most panels, a circle is one neuron; in sequence models, a column is a token and a circle its whole vector at one layer. A square is larger: an image patch, a matrix-valued state, a whole network (in gray). Color and mark both show a cell’s role, so diagrams read without color. Faded parts play little or no role in the step shown. Parts repeated over positions, windows, copies, or passes share weights; layers, experts, encoders, and decoders drawn alike do not. Sections group by a defining trait: wiring, dynamics, training, cost, or purpose. Years and training methods follow landmark papers, not always the first; many can be trained other ways."

# A short primer for readers new to neural networks, opened by the page's "?" button. Each
# section is a title and its text (a blank line starts a new paragraph); `x` marks a variable,
# as elsewhere. A section may show a panel's drawing (`figure`, with `labels` naming its rows
# from the bottom up; with `live`, a seed, the drawing runs on sliders), carry an `anchor` that
# links open it at (#primer-<anchor>), and list a
# `key` of cells and links (`cell` or `link`, each with a line of `text`). With `groups` (a
# line per legend column), the key is the full one: it falls under the legend's columns and
# must list every symbol the diagrams use, once.
primer:
  - title: A network of simple units
    text: >-
      A neural network is built from simple units. Each takes in numbers, multiplies each by a
      weight, adds them up, and passes the sum through a simple nonlinear function. Units are
      arranged in layers, and each layer's outputs feed the next, so simple steps stack into a
      complicated function of the input.
  - title: "An example: the MLP"
    figure: mlp   # a panel drawn in the primer, its rows named bottom to top
    labels: [Inputs, Hidden layer, Hidden layer, Outputs]
    live: 773   # the drawing runs, with weights drawn from this seed; set the inputs below it
    text: >-
      In this network, three numbers pass up through two hidden layers of four units to two
      outputs, along 36 connections, one weight each. Move the inputs: each unit adds up what
      arrives, each value scaled by its line's weight, and squashes the sum to between 0 and 1.
      Thicker lines carry larger weights, and gray ones subtract; brighter units are more
      active. Training changes only the weights (try New weights); the wiring stays as drawn.

      The MLP uses only four of the symbols below, each first in its list: the input unit,
      hidden unit, output unit and connection. The rest appear in other panels, for memory,
      attention, gates and more; each panel's key lists the ones it uses.
  - title: Every mark and link
    anchor: marks   # the page opened at #primer-marks shows the primer here
    text: >-
      Each color and outer mark names a role, and a cell's shape or a small mark inside it
      names the kind.
    groups:   # a line on what each legend column shares: with it, the key lists every symbol
      input: "Yellow, with a stem below: data entering the network."
      hidden: "Green and unmarked: work that stays inside."
      state: "Blue, with a ring: something kept from one step to the next."
      mixing: "Pink, with a tick each side: a unit that combines values from many positions."
      output: "Red, with a stem above: data leaving the network."
      network: "Gray: a whole network as one box."
      links: "Every line is drawn at one weight; only the dash, the arrowhead or the path differs."
    key:   # every cell and link the diagrams use, with the legend's symbol (lint checks it is all of them)
      - {cell: input, text: "One number, or one token's vector, fed in."}
      - {cell: patch, text: "A square tile of an image, fed in as one vector."}
      - {cell: noisy, text: "Data with noise added, which the network learns to clean up."}
      - {cell: noise, text: "Random numbers drawn fresh each time, which a generator turns into data."}
      - {cell: backfed, text: "Set by the data, then updated by the network: in Hopfield and Boltzmann machines the same units are both input and output."}
      - {cell: mask, text: "A token hidden from the network, which it must guess. Hollow, since its value is missing."}
      - {cell: hidden, text: "Adds up what arrives along its lines and applies a nonlinearity."}
      - {cell: prob, text: "Turns on at random, with odds set by its inputs; in the VAE, a code sampled from a learned distribution."}
      - {cell: capsule, text: "Outputs a vector: its length says whether a part is present, its direction how it is posed."}
      - {cell: router, text: "Scores the experts and sends each token to the best few."}
      - {cell: recurrent, text: "Holds a vector it updates at each step from the new input and its last value."}
      - {cell: memory, text: "A store kept apart from the working state, written and read by the network: the LSTM's cell, the NTM's memory, Modern Hopfield's stored patterns."}
      - {cell: matrix, text: "A state that is a whole matrix rather than a vector, updated at each step."}
      - {cell: attention, text: "Weighs every other position by how well it matches, then mixes their values in those proportions."}
      - {cell: conv, text: "Applies one small filter at every window of its input, or pools a window into one value."}
      - {cell: output, text: "A result: a prediction, a class score, the next token."}
      - {cell: match, text: "The network's attempt to rebuild its own input."}
      - {cell: velocity, text: "Which way, and how fast, to move a noisy sample toward real data."}
      - {cell: network, text: "Any architecture: an expert, a generator, a denoiser. Panels that show a way of training draw networks this way, since any can fill the role."}
      - {link: link, text: "One weight: the value below is scaled by it on the way up."}
      - {link: skip, text: "Carries a layer's input around it, to be added to its output or joined to a later layer."}
      - {link: state, text: "Data carried one way: a state to the next step, a message to a neighbor, or, bent around the side, an output fed back in to run the network again."}
      - {link: gate, text: "A learned signal that sets how much passes along the arrow it meets, at the dot."}
      - {link: cross, text: "A comparison: one set of values matched against another, as in cross-attention or a similarity score."}
      - {link: func, text: "A small learned function in place of a single weight."}
  - title: Learning means adjusting weights
    text: >-
      A network starts with random weights. Training shows it examples, scores how wrong its
      output is with a loss (the objective), and nudges every weight to make that score
      better; backpropagation works out which way each weight should move. Over many examples,
      the weights come to encode the task.
  - title: Architectures differ in wiring
    text: >-
      What sets most designs apart is which units connect. Dense layers connect every unit to
      every unit in the next layer; convolutions connect small windows and reuse the same
      weights across them; recurrent networks carry a state from one step to the next;
      attention lets each position weigh every other by its content.
  - title: Training schemes differ in the goal
    text: >-
      The same network can be trained toward different goals: to predict labels, the next word,
      or a hidden one, or to generate new data, as GANs and diffusion models do. Panels that
      show a way of training draw the networks inside as gray boxes, since any network can
      fill them.
  - title: Reading a diagram
    text: >-
      Data flows from the inputs at the bottom to the outputs at the top. Each circle is a unit
      (in sequence models, a whole token's vector), each line a weighted connection, and a
      cell's color and mark show its role, as the key explains. Select any diagram for its
      explanation, how it is trained, and where it came from.
credit: Inspired by The Neural Network Zoo by Fjodor van Veen (Asimov Institute, 2016; updated with Stefan Leijnen, 2019).
credit_link: {text: The Neural Network Zoo, url: "https://www.asimovinstitute.org/neural-network-zoo/"}
